# =====================================================================
#  Configuracion sin secretos: los valores reales se leen de variables
#  de entorno (o de un archivo .env local, ignorado por Git).
#  Si no se definen, el proyecto arranca con H2 en memoria.
# =====================================================================
spring.config.import=optional:file:.env[.properties]

server.port=8082

# --- Base de datos (Neon PostgreSQL via variables de entorno / respaldo H2) ---
spring.datasource.url=${NEON_DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${NEON_DB_USER:sa}
spring.datasource.password=${NEON_DB_PASSWORD:}

# El driver se detecta automaticamente a partir de la URL (H2 o PostgreSQL).
# spring.jpa.hibernate.ddl-auto NO se fija aqui a proposito: Spring Boot usa
# 'create-drop' con H2 embebido y 'none' con Neon (no altera tablas reales).
# Puede sobrescribirse con la variable SPRING_JPA_HIBERNATE_DDL_AUTO.
spring.jpa.show-sql=false

# --- Sincronizacion opcional con la API HTTP de Neon ---
# Las credenciales reales residen solo en .env (ignoradas por Git y enmascaradas como ******** en logs y .env.example)
neon.sync.enabled=${NEON_SYNC_ENABLED:false}
neon.http.url=${NEON_HTTP_URL:}
neon.connection.string=${NEON_CONNECTION_STRING:}
app.auth.password=${APP_AUTH_PASSWORD:utp2026}
management.endpoint.env.additional-keys-to-sanitize=neon.connection.string,NEON_CONNECTION_STRING,NEON_DIRECT_URL,app.auth.password,APP_AUTH_PASSWORD
